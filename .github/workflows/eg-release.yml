name: eg-release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/eg-release.yml'
      - 'scripts/release/**'
      - 'tools/brand/**'
      - 'assets/brand/**'
permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, re, tomllib
          with open('Cargo.toml', 'rb') as f:
              version = tomllib.load(f)['workspace']['package']['version']
          semver = r'(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*))?(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?'
          match = re.fullmatch(semver, version, re.ASCII)
          if not match:
              raise SystemExit(f'Invalid workspace version: {version}')
          if os.environ['EVENT_NAME'] == 'push' and os.environ['REF_NAME'] != 'v' + version:
              raise SystemExit('Tag must equal v followed by the workspace version')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              print(f'version={version}', file=output)
              print(f'prerelease={str(match.group(4) is not None).lower()}', file=output)
          PY
      - if: github.event_name == 'push'
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libdbus-1-dev libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcursor-dev pkg-config
      - run: python -m unittest discover -s scripts/release
      - run: cargo test --workspace --locked --target "${{ matrix.target }}"
      - run: cargo build --release --locked -p eagle-desktop -p eagle-cli --target "${{ matrix.target }}"
      - if: runner.os == 'Linux'
        run: |
          for binary in target/${{ matrix.target }}/release/eagle-desktop target/${{ matrix.target }}/release/eagle-cli; do
            ldd "$binary" | tee dependencies.txt
            if grep -q 'not found' dependencies.txt; then exit 1; fi
          done
      - if: runner.os == 'macOS'
        run: |
          cargo run --locked -p eagle-brand -- build
          otool -L target/${{ matrix.target }}/release/eagle-desktop
          otool -L target/${{ matrix.target }}/release/eagle-cli
      - run: python scripts/release/package.py --target "${{ matrix.target }}" --version "${{ needs.prepare.outputs.version }}" --bin-dir "target/${{ matrix.target }}/release" --output dist
      - if: runner.os == 'macOS'
        run: |
          archive=(dist/*.zip)
          mkdir signed
          unzip -q "${archive[0]}" -d signed
          app=$(find signed -type d -name Eagle.app -print -quit)
          test -n "$app"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          rm "${archive[0]}"
          (cd signed && zip -qry "../${archive[0]}" .)
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'A release already exists for this tag; refusing to overwrite it.' >&2
            exit 1
          fi
          cd dist
          sha256sum ./* > SHA256SUMS
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$TAG" --verify-tag --generate-notes --draft "${flags[@]}" ./*
          gh release edit "$TAG" --draft=false

name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libdbus-1-dev libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcursor-dev pkg-config
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m unittest discover -s bench
      - run: cargo xtask bench
      - run: cargo xtask bench --scenario info
      - run: cargo xtask bench --scenario store
      - uses: actions/upload-artifact@v4
        with:
          name: baseline-${{ matrix.os }}
          path: bench/results/*.csv
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - run: cargo ndk -t arm64-v8a check --workspace --all-targets --locked
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - run: xcrun --sdk iphoneos --show-sdk-path
      - run: cargo check --workspace --all-targets --locked --target aarch64-apple-ios
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny --config deny-ios.toml check licenses bans sources
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libdbus-1-dev libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcursor-dev pkg-config
      - uses: dtolnay/rust-toolchain@1.92.0
      - run: cargo check --workspace --all-targets --locked
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit
      - run: cargo deny check
      - run: cargo audit

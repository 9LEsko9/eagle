[package]
name = "eagle-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
eagle-app = { path = "../app" }
eagle-core = { path = "../core" }
eagle-platform = { path = "../platform" }
eagle-engine = { path = "../engine" }
eagle-palette = { path = "../palette" }
souvlaki = "=0.9.3"
log.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "=1.17.0", default-features = false, features = ["std", "backend-winit", "renderer-skia", "renderer-software", "accessibility", "compat-1-2", "unstable-winit-030"] }

[build-dependencies]
slint-build = "=1.17.0"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dev-dependencies]
i-slint-backend-testing = "=1.17.0"
image = { version = "=0.25.5", default-features = false, features = ["png"] }

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = { version = "=0.26.1", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "=0.3.7", features = ["blocking"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSApplication", "NSRunningApplication"] }

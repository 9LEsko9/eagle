[workspace]
resolver = "3"
members = ["crates/core", "crates/provider-sdk", "crates/providers/yandex", "crates/providers/vk", "crates/providers/_template", "crates/net", "crates/store", "crates/engine", "crates/palette", "crates/platform", "crates/app", "crates/ui", "crates/cli", "crates/desktop", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
license = "GPL-3.0-or-later"

[workspace.dependencies]
thiserror = "2"
log = { version = "0.4", features = ["std", "kv", "release_max_level_debug"] }

# Dev and test builds: the target directory stays small and builds use less RAM.
# Backtraces keep file and line numbers; dependencies carry no debug info.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
opt-level = 0
debug = false

# opt-level 3 is the "-O3" of rustc; LTO and one codegen unit give the smallest, fastest binary,
# and panic=abort drops the unwinding tables.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false

[profile.profiling]
inherits = "release"
debug = 2
strip = false

# Keep MP3 decoding efficient while workspace code remains debuggable.
[profile.dev.package.symphonia-bundle-mp3]
opt-level = 3

[profile.dev.package.eagle-engine]
opt-level = 3
